# Example workflow for consumers.
# Copy this file to .github/workflows/netlify-agents.yml in your repository.
#
# Prerequisites:
#   1. Install the netlify-coding GitHub App on your repo
#   2. Add NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID as repository secrets
#
# Usage: mention @netlify in an issue, PR, or comment to trigger an agent run.
#   @netlify Build a landing page with a hero section
#   @netlify claude Add dark mode support
#   @netlify claude high Refactor the checkout flow   (optional effort level)
#   @netlify fable high Refactor the checkout flow    (model implies the agent)
#   @netlify codex Fix the mobile layout

name: Netlify Agent Runners

on:
  workflow_dispatch:
    inputs:
      trigger_text:
        description: 'What should the agent build or change? (e.g. "Add a dark mode toggle")'
        required: true
        type: string
        default: '@netlify'
      actor:
        description: 'GitHub username to attribute this run to'
        required: true
        type: string
      agent:
        description: 'Agent to use'
        required: false
        type: choice
        options:
          - codex
          - claude
          - gemini
        default: 'codex'
      model_id:
        description: 'Model (auto lets the backend choose; a model picks its own agent)'
        required: false
        type: choice
        options:
          - auto
          - claude-fable-5
          - claude-opus-5
          - claude-opus-4-8
          - claude-sonnet-5
          - claude-haiku-4-5
          - gpt-5.6-sol
          - gpt-5.6-terra
          - gpt-5.6-luna
          - gpt-5.4-mini
          - gemini-3.1-pro-preview
          - gemini-3.6-flash
          - gemini-3.5-flash-lite
        default: 'auto'
      effort:
        description: 'Effort level (auto lets the backend choose)'
        required: false
        type: choice
        options:
          - auto
          - low
          - medium
          - high
        default: 'auto'
  pull_request_target:
    types: [opened, reopened]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted, edited]
  issues:
    types: [opened, assigned, edited]
  issue_comment:
    types: [created, edited]

concurrency:
  group: netlify-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  netlify-agent:
    # Skip bot senders to avoid burning Actions minutes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.sender.login != 'github-actions[bot]' &&
        github.event.sender.login != 'netlify-coding[bot]' &&
        github.event.sender.login != 'netlify[bot]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: netlify-labs/agent-runner-action@v1
        with:
          netlify-auth-token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          netlify-site-id: ${{ secrets.NETLIFY_SITE_ID }}
          # Optional settings:
          # default-agent: 'codex'        # Default agent (claude, codex, gemini)
          # default-model-id: ''          # Default model (e.g. claude-fable-5 or fable); empty = Auto
          # default-effort: ''            # Default effort (low, medium, high); empty = Auto
          # manage-labels: 'false'        # Auto-create and apply labels
          # dry-run: 'false'              # Still starts an agent run; skips commit/PR creation
          # preflight-only: 'false'       # Validate setup only; starts no agent run
          # If both are true, preflight-only behavior wins.
          # preflight-only: 'true'        # Example: verify config/permissions and exit
          # dry-run: 'true'               # Example: run preview without committing changes
          # timeout-minutes: '10'         # Max wait for agent completion
          # netlify-cli-version: '24.8.1' # Netlify CLI version
          # timezone: 'America/Los_Angeles' # Timezone for rendered timestamps
          # debug: 'false'                # Enable debug logging
